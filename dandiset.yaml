description: This dataset contains widefield calcium imaging and behavioral data from
  mice, investigating how prior expectations and neural dynamics are modified in the
  CNTNALP2 knockout mouse model of autism. The study employs a decision-making task
  involving sensory perception to understand the neural basis of altered prior utilization.
