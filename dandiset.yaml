description: This dataset contains widefield imaging data from mice, investigating
  how prior expectations and neural dynamics are modified in a mouse model of autism
  (CNTNALP2 knockout). The study explores sensory perception and decision-making tasks
  to understand the neural basis of altered prior utilization.
